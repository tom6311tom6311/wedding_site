services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      WEB_ORIGIN: ${WEB_ORIGIN}
      PHONE_HASH_SECRET: ${PHONE_HASH_SECRET}
      BROWSER_TOKEN_SECRET: ${BROWSER_TOKEN_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET}
      HOST: 0.0.0.0
      PORT: 4000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
      args:
        VITE_RSVP_API_BASE_URL: ${VITE_RSVP_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "${WEB_HTTP_PORT}:80"
    depends_on:
      - api
